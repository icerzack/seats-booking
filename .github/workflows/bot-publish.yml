name: Build and Publish Bot Docker Image

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version of the image to build (`latest` if not provided)'
        required: false
        default: 'latest'
  workflow_call:
    inputs:
      version:
        description: 'Version of the image to build (`latest` if not provided)'
        required: false
        default: 'latest'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/bot

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v2
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          file: ./build/Dockerfile.bot
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ inputs.version || github.event.inputs.version || 'latest' }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest