# SonarQube Configuration for Seats Booking Application

# Global project information
sonar.projectKey=seats-booking
sonar.projectName=Seats Booking Application
sonar.projectVersion=1.0

# Source code
sonar.sources=backend/src/main,frontend/src
sonar.tests=backend/src/test,frontend/src

# Modules configuration
sonar.modules=backend,frontend

# Backend module configuration
backend.sonar.projectKey=seats-booking-backend
backend.sonar.projectName=Seats Booking Backend
backend.sonar.sources=src/main
backend.sonar.tests=src/test
backend.sonar.java.binaries=target/classes
backend.sonar.java.test.binaries=target/test-classes
backend.sonar.coverage.jacoco.xmlReportPaths=target/site/jacoco/jacoco.xml

# Frontend module configuration
frontend.sonar.projectKey=seats-booking-frontend
frontend.sonar.projectName=Seats Booking Frontend
frontend.sonar.sources=src
frontend.sonar.tests=src
frontend.sonar.test.inclusions=**/*.test.js,**/*.test.jsx,**/*.spec.js,**/*.spec.jsx
frontend.sonar.javascript.lcov.reportPaths=coverage/lcov.info

# Exclusions
sonar.coverage.exclusions=**/*Application.java,**/*Config.java,**/*Configuration.java,**/src/index.js,**/src/serviceWorker.js,**/*.test.js,**/*.spec.js

# Encoding
sonar.sourceEncoding=UTF-8

# Quality Gate
sonar.qualitygate.wait=true 